[build-system]
requires = ["meson-python", "ninja", "meson"]
build-backend = "mesonpy"

[project]
name = "vsfgs"
version = "0.5.0"
description = "A VapourSynth plugin for applying Film Grain Synthesis (FGS) using the dav1d engine."
readme = "README.md"
license = {text = "MIT"}
keywords = ["vapoursynth", "film-grain", "fgs", "dav1d", "video-processing", "afgs1", "av1", "simd"]
requires-python = ">=3.13"
dependencies = [
    "vapoursynth>=74"
]
authors = [
    { name = "PingWer74" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Programming Language :: Assembly",
    "Operating System :: OS Independent",
    "Environment :: Plugins",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/PingWer/vs-fgs"
Issues = "https://github.com/PingWer/vs-fgs/issues"

[tool.meson-python]
allow-windows-internal-shared-libs = true

[tool.meson-python.args]
setup = ["--vsenv"]